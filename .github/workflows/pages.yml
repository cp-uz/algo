name: Deploy algorithms site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Set this repository variable to the deployed editor origin, for example
      # https://algo-editor.cp.uz. Relative local editor links remain the default
      # when the variable is absent.
      CPUZ_EDITOR_BASE_URL: ${{ vars.CPUZ_EDITOR_BASE_URL }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build deterministic static site
        run: python scripts/build_static.py

      - name: Run tests
        run: python -m pytest -q

      - name: Validate repository and generated site
        run: python scripts/validate.py

      - name: Run fast C++ Algebra smoke checks
        run: make qa-algebra

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
